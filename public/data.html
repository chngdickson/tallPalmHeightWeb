<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <!-- <link rel="icon" href="./favicon.ico.png" type="image/x-icon"> -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- CSS File Init-->
        <link rel="stylesheet" href="./src/css/bodies/data_htm.css">
        <link rel="stylesheet" href="./src/css/main.css">
        <link href="./src/css/fonts/fontawesome/all.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="./src/css/components/data_download_table.css">
        <link rel="stylesheet" href="./src/css/components/zip_downloadHandler.css">
        <!-- Js Script Init -->
        <script type="module" src="./src/js/main.js"></script>
        <script type="module" src="./src/js/components/data_download_table.js" defer></script>
        <script type="module" src="/socket.io/socket.io.js"></script>
        <script type="module" src="./src/js/components/zip_downloadHandler.js" defer></script>
        <title>Data Processing Dashboard</title>
        
    </head>

    <body>
        <!-- Header partial -->
        <div id="header"></div>
        <main>
            <div class="container2">
                <div class="header2">
                    <div class="header-content2">
                        <h1><i class="fas fa-database"></i> Data Processing Dashboard</h1>
                        <button class="export-btn">
                            <i class="fas fa-envelope"></i> john.doe@sdguthrie.com
                        </button>
                    </div>
                </div>
                
                <div class="controls">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search processed data...">
                    </div>
                    
                    <div class="filter-group">
                        <select>
                            <option>All Status</option>
                            <option>Completed</option>
                            <option>Processing</option>
                            <option>Error</option>
                        </select>
                        
                        <select>
                            <option>Last 24 Hours</option>
                            <option>Last 7 Days</option>
                            <option>Last 30 Days</option>
                            <option>Custom Range</option>
                        </select>
              
                    </div>
                </div>
                <div class="stat-card code">
                    <h1 id="clicked-file-id">Inspecting : "SAMPLE.txt"</h1>
                </div>
                <div class="stats-cards">
                    <div class="stat-card">
                        <img id="img-1" class="logo-image2" src="./src/images/palmFront.png"/>
                        <h3>Tree: 1</h3>
                    </div> 
                    
                    <div class="stat-card">
                        <img id="img-2" class="logo-image2" src="./src/images/palmFront.png"/>
                        <h3>Tree: 2</h3>
                    </div> 
                    <div class="stat-card">
                        <img id="img-3" class="logo-image2" src="./src/images/palmFront.png"/>
                        <h3>Tree: 3</h3>
                    </div>                    
                    <div class="stat-card">
                        <img id="img-4" class="logo-image2" src="./src/images/palmFront.png"/>
                        <h3>Tree: 4</h3>
                    </div> 
                </div>
                
                <div class="charts">
                    <div class="chart-container2">
                        <h3>Pointcloud Top View</h3>
                        <div class="chart">
                            <img id="img-top" class="logo-image2" src="./src/images/test2_coor.png"/>
                        </div>
                    </div>
                    
                    <div class="stats-cards">
                        <div class="stat-card">
                            <img id="img-5" class="logo-image2" src="./src/images/palmFront.png"/>
                            <h3>Tree: 5</h3>
                        </div> 
                        
                        <div class="stat-card">
                            <img id="img-6" class="logo-image2" src="./src/images/palmFront.png"/>
                            <h3>Tree: 6</h3>
                        </div> 
                    </div>
                </div>
                
                <div class="data-table">
                    <table>
                        <thead>
                            <tr>
                                <th>ID <i class="fas fa-sort"></i></th>
                                <th>File Name <i class="fas fa-sort"></i></th>
                                <th>Coordinates <i class="fas fa-sort"></i></th>
                                <th>Download Report <i class="fas fa-sort"></i></th>
                                <th>Status <i class="fas fa-sort"></i></th>
                                <th>Logs <i class="fas fa-sort"></i></th>
                                <th>Start Time <i class="fas fa-sort"></i></th>
                                <th>Trees / GB <i class="fas fa-sort"></i></th>
                            </tr>
                        </thead>
                        <tbody id="id_table_body" class="data-table">
                        </tbody>
                    </table>
                </div>
            
                <div id="pagination-container" class="pagination">
                    <button id="prev-btn" disabled>
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <div id="page-numbers">
                        <!-- Page buttons will be generated here -->
                    </div>
                    <button id="next-btn" disabled>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
            <div id="zip-popup"></div>
        </main>
        <!-- Footer partial -->
        <div id="footer"></div>
    </body>
</html>
