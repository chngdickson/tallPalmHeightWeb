<!DOCTYPE html>
<html>
<head>
    <title>Local Test - Point Cloud Processor</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        .card { background: #f5f5f5; padding: 20px; margin: 10px 0; border-radius: 8px; }
        .progress-bar { width: 100%; height: 20px; background: #ddd; border-radius: 10px; }
        .progress-fill { height: 100%; background: #0078d4; border-radius: 10px; transition: width 0.3s; }
        button { background: #0078d4; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Local Point Cloud Processor Test</h1>
    
    <div class="card">
        <h3>Test Processing</h3>
        <input type="text" id="pointcloudUrl" value="https://example.com/test.ply" style="width: 300px; padding: 8px;">
        <button onclick="startProcessing()">Start Test Processing</button>
    </div>

    <div class="card">
        <h3>Progress</h3>
        <div id="jobStatus">Ready</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div id="progressText">0%</div>
        <div id="message">Click start to begin test</div>
    </div>

    <div class="card">
        <h3>Results</h3>
        <div id="results"></div>
    </div>

    <script>
        let currentJobId = null;
        
        function startProcessing() {
            const url = document.getElementById('pointcloudUrl').value;
            
            fetch('http://localhost:7071/api/start_processing', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pointcloudUrl: url })
            })
            .then(response => response.json())
            .then(data => {
                currentJobId = data.id;
                document.getElementById('jobStatus').textContent = 'Running...';
                startPolling();
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }
        
        function startPolling() {
            const poll = () => {
                if (!currentJobId) return;
                
                fetch(`http://localhost:7071/api/get_job_status/${currentJobId}`)
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('progressFill').style.width = data.progress + '%';
                        document.getElementById('progressText').textContent = data.progress + '%';
                        document.getElementById('message').textContent = data.message;
                        
                        if (data.status === 'Completed') {
                            document.getElementById('jobStatus').textContent = 'Completed';
                            document.getElementById('results').innerHTML = `
                                <p>Test completed successfully!</p>
                                <pre>${JSON.stringify(data.results, null, 2)}</pre>
                            `;
                        } else if (data.status === 'Failed') {
                            document.getElementById('jobStatus').textContent = 'Failed';
                        } else {
                            setTimeout(poll, 1000); // Poll every second
                        }
                    })
                    .catch(error => {
                        console.error('Polling error:', error);
                        setTimeout(poll, 2000);
                    });
            };
            poll();
        }
    </script>
</body>
</html>
