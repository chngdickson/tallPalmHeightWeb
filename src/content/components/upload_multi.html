<div id="upload-files" class="text-center">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <div class="upload-container" id="drop-zone">
    <div class="upload-icon">
        <i class="fas fa-cloud-upload-alt"></i>
    </div>
    <p class="upload-text">Drag & drop your files here or click to browse</p>
    <button class="browse-btn" id="browse-btn">
        <i class="fas fa-folder-open"></i> Select Files
    </button>
    <input type="file" id="file-input" multiple>
  </div>



  <div class="concurrency-control">
    <span class="concurrency-label">Simultaneous Uploads:</span>
    <input type="range" min="1" max="10" value="3" class="concurrency-slider" id="concurrency-slider">
    <span class="concurrency-value" id="concurrency-value">3</span>
  </div>

  <div class="selected-files" id="selected-files">
      <h3>Selected Files <span id="files-count">(0)</span></h3>
      <div class="file-list" id="file-list">
      </div>
      
      <div class="summary">
          <div class="summary-item">
              <div class="summary-value" id="total-files">0</div>
              <div class="summary-label">Total Files</div>
          </div>
          <div class="summary-item">
              <div class="summary-value" id="total-size">0 MB</div>
              <div class="summary-label">Total Size</div>
          </div>
          <div class="summary-item">
              <div class="summary-value" id="process-time">0s</div>
              <div class="summary-label">Est. Process Time</div>
          </div>
      </div>
  </div>

  <button class="upload-btn" id="upload-btn">
      <i class="fas fa-play-circle"></i> Start Simultaneous Upload
  </button>

  <div class="completed-files" id="completed-files">
      <h3>Processed Files</h3>
      <div class="completed-list" id="completed-files-list"></div>
  </div>
</div>
