<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <base href="/public/">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./src/css/bodies/data_htm.css">
        <link rel="stylesheet" href="./src/css/main.css">
        <script type="module" src="./src/js/main.js"></script>
        <link href="./src/css/fonts/fontawesome/all.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <title>Data Processing Dashboard</title>
        <style>
            /* Your provided CSS */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                background-color: #f5f7fa;
                color: #333;
                line-height: 1.6;
            }

            .container2 {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
            }

            .header2 {
                background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
                color: white;
                padding: 20px 0;
                border-radius: 10px;
                margin-bottom: 20px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            }

            .header-content2 {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 20px;
            }

            h1 {
                font-size: 28px;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .controls {
                display: flex;
                gap: 15px;
                margin-bottom: 20px;
                flex-wrap: wrap;
            }

            .search-box {
                flex: 1;
                min-width: 250px;
                position: relative;
            }

            .search-box input {
                width: 100%;
                padding: 12px 15px 12px 40px;
                border: 1px solid #ddd;
                border-radius: 8px;
                font-size: 16px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            }

            .search-box i {
                position: absolute;
                left: 15px;
                top: 50%;
                transform: translateY(-50%);
                color: #777;
            }

            .filter-group {
                display: flex;
                gap: 15px;
                flex-wrap: wrap;
            }

            select {
                padding: 12px 15px;
                border: 1px solid #ddd;
                border-radius: 8px;
                background: white;
                font-size: 14px;
                min-width: 150px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            }

            .stats-cards {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
                margin-bottom: 20px;
            }

            .stat-card {
                background: white;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
                text-align: center;
            }
            .stat-card h1 {
                font-size: 25px;
                text-align: center;
                justify-content: center;
                margin-bottom: 0px;
            }
            .stat-card h3 {
                font-size: 16px;
                color: #777;
                margin-bottom: 10px;
            }

            .stat-card .value {
                font-size: 28px;
                font-weight: bold;
                color: #2575fc;
            }

            .stat-card .trend {
                font-size: 14px;
                margin-top: 5px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 5px;
            }

            .trend.up {
                color: #2ecc71;
            }

            .trend.down {
                color: #e74c3c;
            }

            .data-table {
                background: white;
                border-radius: 10px;
                overflow: hidden;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
                margin-bottom: 30px;
                overflow-x: auto;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th, td {
                padding: 15px 20px;
                text-align: left;
                border-bottom: 1px solid #eee;
            }

            th {
                background-color: #f8fafd;
                font-weight: 600;
                color: #5278a3;
                cursor: pointer;
            }

            th:hover {
                background-color: #edf2f7;
            }

            tr:last-child td {
                border-bottom: none;
            }

            tr:hover {
                background-color: #f9fbfd;
            }
            tr.active {
                background: linear-gradient(135deg, #6a11cb 0%, #3a82fd 200%);
                color: white;
                border-color: #2575fc;
            }

            .status {
                display: inline-block;
                padding: 5px 12px;
                border-radius: 20px;
                font-size: 12px;
                font-weight: 500;
            }

            .status.completed {
                background-color: #e6f7ee;
                color: #2ecc71;
            }

            .status.processing {
                background-color: #ebf3ff;
                color: #3498db;
            }

            .status.error {
                background-color: #fde8e8;
                color: #e74c3c;
            }

            .download-btn {
                background: #2575fc;
                color: white;
                border: none;
                padding: 8px 12px;
                border-radius: 5px;
                font-size: 12px;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 5px;
                text-decoration: none;
                transition: all 0.2s;
            }

            .download-btn:hover {
                background: #1c64e0;
            }

            .view-logs2 {
                color: #2575fc;
                text-decoration: none;
                font-size: 14px;
                display: inline-flex;
                align-items: center;
                gap: 5px;
                transition: all 0.2s;
            }

            .view-logs2:hover {
                color: #1c64e0;
                text-decoration: underline;
            }

            .pagination {
                display: flex;
                justify-content: center;
                gap: 10px;
                margin-top: 20px;
            }

            .pagination button {
                padding: 8px 15px;
                background: white;
                border: 1px solid #ddd;
                border-radius: 5px;
                cursor: pointer;
                transition: all 0.2s;
            }

            .pagination button:hover {
                background: #f1f5f9;
            }

            .pagination button.active {
                background: #2575fc;
                color: white;
                border-color: #2575fc;
            }

            .charts {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
            }

            .chart-container2 {
                background: white;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
                margin-bottom: 20px;
            }

            .chart-container2 h3 {
                margin-bottom: 15px;
                color: #5278a3;
                font-size: 18px;
            }

            .chart {
                height: 250px;
                display: flex;
                align-items: flex-end;
                gap: 10px;
                padding-top: 20px;
                justify-content: center;
            }

            .bar {
                width: 40px;
                background: linear-gradient(to top, #6a11cb, #2575fc);
                border-radius: 5px 5px 0 0;
                position: relative;
            }

            .bar-label {
                position: absolute;
                bottom: -25px;
                left: 50%;
                transform: translateX(-50%);
                font-size: 12px;
                color: #777;
            }

            @media (max-width: 768px) {
                .charts {
                    grid-template-columns: 1fr;
                }
                
                .chart {
                    height: 200px;
                }
                
                .bar {
                    width: 30px;
                }
            }

            .export-btn {
                background: #2575fc;
                color: white;
                border: none;
                padding: 12px 20px;
                border-radius: 8px;
                font-size: 16px;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
                margin-left: auto;
                transition: background 0.3s;
            }

            .export-btn:hover {
                background: #1c64e0;
            }

            .file-icon2 {
                display: inline-flex;
                margin-right: 8px;
                color: #5278a3;
            }

            /* Sliding Window Pagination Styles */
            .sliding-pagination { 
                margin: 20px 0; 
                text-align: center;
            }
            .sliding-pagination button { 
                padding: 10px 15px; 
                margin: 0 5px; 
                border: 1px solid #ddd; 
                background: white; 
                cursor: pointer; 
                border-radius: 5px;
                transition: all 0.2s;
            }
            .sliding-pagination button:hover { 
                background: #f1f5f9; 
            }
            .sliding-pagination button.active { 
                background: #2575fc; 
                color: white; 
                border-color: #2575fc;
            }
            
            /* Image Preview Styles */
            .image-preview-section { 
                margin: 30px 0; 
                padding: 25px; 
                border: 1px solid #e1e8ed; 
                border-radius: 10px;
                background: white;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
                display: none;
            }
            .image-container { 
                display: flex; 
                gap: 20px; 
                flex-wrap: wrap; 
                margin-top: 20px;
                justify-content: center;
            }
            .image-container img { 
                width: 200px;           
                height: 150px;          
                object-fit: cover;      
                border: 1px solid #e1e8ed;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
                transition: transform 0.2s;
            }
            .image-container img:hover {
                transform: scale(1.05);
            }
            .loading { 
                color: #666; 
                font-style: italic; 
                text-align: center;
                padding: 20px;
            }
            .no-images { 
                color: #999; 
                font-style: italic; 
                text-align: center;
                padding: 20px;
            }
            
            /* Clickable rows */
            .data-table tbody tr { cursor: pointer; }
            .data-table tbody tr:hover { background-color: #f9fbfd; }
            .data-table tbody tr.selected { 
                background: linear-gradient(135deg, #6a11cb 0%, #3a82fd 200%);
                color: white;
            }
            .data-table tbody tr.selected td {
                border-color: #3a82fd;
            }
            .data-table tbody tr.selected .status,
            .data-table tbody tr.selected .view-logs2,
            .data-table tbody tr.selected .download-btn {
                color: white;
                background: rgba(255, 255, 255, 0.2);
            }
        </style>
    </head>

    <body>
        <!-- Header partial -->
        <div id="header"></div>
        <main>
            <div class="container2">
                <div class="header2">
                    <div class="header-content2">
                        <h1><i class="fas fa-database"></i> Data Processing Dashboard</h1>
                        <button class="export-btn">
                            <i class="fas fa-envelope"></i> john.doe@sdguthrie.com
                        </button>
                    </div>
                </div>
                
                <div class="controls">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search processed data...">
                    </div>
                    
                    <div class="filter-group">
                        <select>
                            <option>All Status</option>
                            <option>Completed</option>
                            <option>Processing</option>
                            <option>Error</option>
                        </select>
                        
                        <select>
                            <option>Last 24 Hours</option>
                            <option>Last 7 Days</option>
                            <option>Last 30 Days</option>
                            <option>Custom Range</option>
                        </select>
                    </div>
                </div>

                <!-- Image Preview Section -->
                <div class="image-preview-section" id="imagePreview">
                    <h3><i class="fas fa-images"></i> Image Preview for: <span id="selectedFileName"></span></h3>
                    <div class="image-container" id="imageContainer"></div>
                </div>

                <div class="stat-card code">
                    <h1>Inspecting : <span id="currentFile">Select a file to inspect</span></h1>
                </div>

                <div class="stats-cards">
                    <div class="stat-card">
                        <div><img class="logo-image2" src="./src/images/palmFront.png"/></div>
                        <h3>Tree: 1</h3>
                    </div> 
                    
                    <div class="stat-card">
                        <img class="logo-image2" src="./src/images/palmFront.png"/>
                        <h3>Tree: 2</h3>
                    </div> 
                    <div class="stat-card">
                        <img class="logo-image2" src="./src/images/palmFront.png"/>
                        <h3>Tree: 3</h3>
                    </div>                    
                    <div class="stat-card">
                        <img class="logo-image2" src="./src/images/palmFront.png"/>
                        <h3>Tree: 4</h3>
                    </div> 
                </div>
                
                <div class="charts">
                    <div class="chart-container2">
                        <h3>Pointcloud Top View</h3>
                        <div class="chart">
                            <img class="logo-image2" src="./src/images/test2_coor.png"/>
                        </div>
                    </div>
                    
                    <div class="stats-cards">
                        <div class="stat-card">
                            <img class="logo-image2" src="./src/images/palmFront.png"/>
                            <h3>Tree: 5</h3>
                        </div> 
                        
                        <div class="stat-card">
                            <img class="logo-image2" src="./src/images/palmFront.png"/>
                            <h3>Tree: 6</h3>
                        </div> 
                    </div>
                </div>
                
                <div class="data-table">
                    <table id="mainDataTable">
                        <thead>
                            <tr>
                                <th>ID <i class="fas fa-sort"></i></th>
                                <th>File Name <i class="fas fa-sort"></i></th>
                                <th>Coordinates <i class="fas fa-sort"></i></th>
                                <th>Download Report <i class="fas fa-sort"></i></th>
                                <th>Status <i class="fas fa-sort"></i></th>
                                <th>Logs <i class="fas fa-sort"></i></th>
                                <th>Start Time <i class="fas fa-sort"></i></th>
                                <th>Trees / GB <i class="fas fa-sort"></i></th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Data rows will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            
                <!-- Sliding Window Pagination -->
                <div class="sliding-pagination" id="slidingPagination">
                    <!-- Buttons will be generated by JavaScript -->
                </div>
            </div>
        
            <script>
                // Sample data - 60 rows with reliable image URLs
                const allData = [];
                
                // Using placeholder images that are more reliable
                const getImageUrl = (id, index) => {
                    const baseUrls = [
                        `https://picsum.photos/200/150?random=${id}${index}`,
                        `https://via.placeholder.com/200x150/2575fc/ffffff?text=Tree+${id}.${index}`,
                        `https://via.placeholder.com/200x150/6a11cb/ffffff?text=Point+${id}.${index}`
                    ];
                    return baseUrls[0]; // Using picsum for variety
                };

                // Generate sample data
                for (let i = 60; i >= 1; i--) {
                    const statuses = ["Completed", "Processing", "Error"];
                    const status = statuses[Math.floor(Math.random() * statuses.length)];
                    const coordTypes = ["XYZ", "Lat/Long"];
                    const coordType = coordTypes[Math.floor(Math.random() * coordTypes.length)];
                    
                    // Only generate images for "Completed" status
                    let images = [];
                    if (status === "Completed") {
                        const imageCount = Math.floor(Math.random() * 3) + 2;
                        for (let j = 0; j < imageCount; j++) {
                            images.push(getImageUrl(i, j));
                        }
                    }
                    
                    allData.push({
                        id: `#${1000 + i}`,
                        fileName: `file${i}.${i % 2 === 0 ? 'laz' : 'pcd'}`,
                        coordinates: coordType,
                        status: status,
                        startTime: `Today, ${Math.floor(Math.random() * 12) + 1}:${Math.floor(Math.random() * 60).toString().padStart(2, '0')} ${Math.random() > 0.5 ? 'AM' : 'PM'}`,
                        treesGB: `${Math.floor(Math.random() * 300) + 20} / ${(Math.random() * 10 + 0.5).toFixed(1)} GB`,
                        images: images
                    });
                }

                // Pagination variables
                const totalRows = 60;
                const buttonsCount = 6;
                const rowsPerPage = 5;
                let currentWindowStart = 0;
                let selectedRow = null;

                // Initialize the dashboard
                function initDashboard() {
                    updatePaginationButtons();
                    showPage(1);
                    setupEventListeners();
                }

                // Update pagination buttons
                function updatePaginationButtons() {
                    const paginationDiv = document.getElementById('slidingPagination');
                    paginationDiv.innerHTML = '';
                    
                    for (let i = 0; i < buttonsCount; i++) {
                        const button = document.createElement('button');
                        const startRow = currentWindowStart + (i * rowsPerPage) + 1;
                        const endRow = startRow + rowsPerPage - 1;
                        button.textContent = `${i + 1} (${startRow}-${endRow})`;
                        button.onclick = () => showPage(i + 1);
                        if (i === 0) button.classList.add('active');
                        paginationDiv.appendChild(button);
                    }
                }

                // Show specific page
                function showPage(buttonNumber) {
                    const clickedButtonIndex = buttonNumber - 1;
                    
                    // Slide window logic
                    if (clickedButtonIndex >= 2 && currentWindowStart + (buttonsCount * rowsPerPage) < totalRows) {
                        const newStart = currentWindowStart + (clickedButtonIndex - 1) * rowsPerPage;
                        currentWindowStart = Math.min(newStart, totalRows - (buttonsCount * rowsPerPage));
                        updatePaginationButtons();
                    }
                    else if (clickedButtonIndex === 0 && currentWindowStart > 0) {
                        currentWindowStart = Math.max(0, currentWindowStart - (2 * rowsPerPage));
                        updatePaginationButtons();
                    }
                    
                    const startIndex = currentWindowStart + (clickedButtonIndex * rowsPerPage);
                    const endIndex = Math.min(startIndex + rowsPerPage, totalRows);
                    const pageData = allData.slice(startIndex, endIndex);
                    
                    displayTable(pageData);
                    updateActiveButton(buttonNumber);
                }

                // Display data in table
                function displayTable(data) {
                    const tableBody = document.getElementById('tableBody');
                    tableBody.innerHTML = '';
                    
                    data.forEach((row, index) => {
                        const tr = document.createElement('tr');
                        
                        // Make row clickable if completed
                        if (row.status === "Completed") {
                            tr.onclick = () => selectRow(row);
                            if (selectedRow && selectedRow.id === row.id) {
                                tr.classList.add('selected');
                            }
                        }
                        
                        const statusClass = row.status.toLowerCase() === 'completed' ? 'completed' : 
                                          row.status.toLowerCase() === 'error' ? 'error' : 'processing';
                        
                        tr.innerHTML = `
                            <td>${row.id}</td>
                            <td><a href="#" class="view-logs2"><i class="fas fa-file file-icon2"></i> ${row.fileName}</a></td>
                            <td>${row.coordinates}</td>
                            <td><a href="#" class="download-btn"><i class="fas fa-download"></i> Download</a></td>
                            <td><span class="status ${statusClass}">${row.status}</span></td>
                            <td><a href="#" class="view-logs2"><i class="fas fa-list"></i> View Logs</a></td>
                            <td>${row.startTime}</td>
                            <td>${row.treesGB}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                }

                // Handle row selection
                async function selectRow(row) {
                    // Remove previous selection
                    const rows = document.querySelectorAll('#tableBody tr');
                    rows.forEach(r => r.classList.remove('selected'));
                    
                    // Add selection to clicked row
                    event.currentTarget.classList.add('selected');
                    selectedRow = row;
                    
                    // Update current file display
                    document.getElementById('currentFile').textContent = row.fileName;
                    
                    // Show image preview
                    await showImagePreview(row);
                }

                // Show image preview
                async function showImagePreview(row) {
                    const imagePreview = document.getElementById('imagePreview');
                    const imageContainer = document.getElementById('imageContainer');
                    const selectedFileName = document.getElementById('selectedFileName');
                    
                    selectedFileName.textContent = row.fileName;
                    imagePreview.style.display = 'block';
                    
                    if (row.images.length === 0) {
                        imageContainer.innerHTML = '<div class="no-images">No images available for this file</div>';
                        return;
                    }
                    
                    imageContainer.innerHTML = '<div class="loading">Loading images...</div>';
                    
                    // Load images with better error handling
                    const loadPromises = row.images.map(async (imageUrl, index) => {
                        return new Promise((resolve) => {
                            const img = new Image();
                            img.onload = () => resolve(img);
                            img.onerror = () => {
                                // Fallback to placeholder if image fails to load
                                const fallbackImg = new Image();
                                fallbackImg.src = `https://via.placeholder.com/200x150/e1e8ed/5278a3?text=Image+${index+1}`;
                                fallbackImg.alt = `${row.fileName} preview ${index+1}`;
                                fallbackImg.style.width = '200px';
                                fallbackImg.style.height = '150px';
                                fallbackImg.style.objectFit = 'cover';
                                resolve(fallbackImg);
                            };
                            img.src = imageUrl;
                            img.alt = `${row.fileName} preview ${index+1}`;
                            img.style.width = '200px';
                            img.style.height = '150px';
                            img.style.objectFit = 'cover';
                        });
                    });

                    try {
                        const loadedImages = await Promise.all(loadPromises);
                        imageContainer.innerHTML = '';
                        loadedImages.forEach(img => imageContainer.appendChild(img));
                    } catch (error) {
                        imageContainer.innerHTML = '<div class="no-images">Failed to load images</div>';
                    }
                }

                // Update active button style
                function updateActiveButton(activeButton) {
                    const buttons = document.querySelectorAll('.sliding-pagination button');
                    buttons.forEach((button, index) => {
                        if (index + 1 === activeButton) {
                            button.classList.add('active');
                        } else {
                            button.classList.remove('active');
                        }
                    });
                }

                // Setup event listeners
                function setupEventListeners() {
                    // Export button
                    document.querySelector('.export-btn').addEventListener('click', () => {
                        alert('Data export started. You will receive an email when it is ready.');
                    });
                    
                    // Download buttons
                    document.addEventListener('click', (e) => {
                        if (e.target.closest('.download-btn')) {
                            e.preventDefault();
                            const fileName = e.target.closest('tr').querySelector('td:nth-child(2)').textContent.trim();
                            alert(`Preparing download for: ${fileName}`);
                        }
                    });
                    
                    // View logs
                    document.addEventListener('click', (e) => {
                        if (e.target.closest('.view-logs2')) {
                            e.preventDefault();
                            const fileId = e.target.closest('tr').querySelector('td:first-child').textContent;
                            alert(`Showing logs for file ID: ${fileId}`);
                        }
                    });
                }

                // Initialize when page loads
                window.onload = initDashboard;
            </script>
        </main>
        <!-- Footer partial -->
        <div id="footer"></div>
    </body>
</html>
