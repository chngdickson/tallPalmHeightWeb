<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload with Progress</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 600px;
            padding: 35px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        p {
            color: #7f8c8d;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        
        .upload-container {
            border: 2px dashed #3498db;
            border-radius: 12px;
            padding: 35px 20px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            background-color: #f8fafc;
            position: relative;
        }
        
        .upload-container:hover, .upload-container.dragover {
            background-color: #e1f0fa;
            border-color: #2980b9;
        }
        
        .upload-icon {
            font-size: 60px;
            color: #3498db;
            margin-bottom: 15px;
        }
        
        .upload-text {
            margin-bottom: 20px;
            color: #34495e;
        }
        
        .browse-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .browse-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        
        #file-input {
            display: none;
        }
        
        .file-info {
            text-align: left;
            background-color: #f8fafc;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        
        .file-info h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .file-details {
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .progress-container {
            width: 100%;
            height: 12px;
            background-color: #ecf0f1;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
            display: none;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        .upload-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
            margin-top: 20px;
            display: none;
            width: 100%;
        }
        
        .upload-btn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }
        
        .upload-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .success {
            background-color: #2ecc71;
        }
        
        .error {
            background-color: #e74c3c;
        }
        
        .upload-status {
            margin: 15px 0;
            font-weight: 500;
            color: #7f8c8d;
        }
        
        .uploaded-files {
            text-align: left;
            margin-top: 30px;
            display: none;
        }
        
        .uploaded-files h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ecf0f1;
        }
        
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background-color: #f8fafc;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        
        .file-name {
            color: #2c3e50;
            font-weight: 500;
        }
        
        .file-size {
            color: #7f8c8d;
            font-size: 14px;
        }
        
        footer {
            margin-top: 30px;
            color: #95a5a6;
            font-size: 14px;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            
            .upload-container {
                padding: 25px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Universal File Upload</h1>
        <p>Upload any type of file - documents, images, videos, archives, and more. Maximum file size: 100MB.</p>
        
        <div class="upload-container" id="drop-zone">
            <div class="upload-icon">📁</div>
            <p class="upload-text">Drag & drop your file here</p>
            <button class="browse-btn" id="browse-btn">Browse Files</button>
            <input type="file" id="file-input" multiple>
        </div>
        
        <div class="file-info" id="file-info">
            <h3>Selected File:</h3>
            <div class="file-details" id="file-details"></div>
        </div>
        
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="upload-status" id="upload-status"></div>
        
        <button class="upload-btn" id="upload-btn">Upload File</button>
        
        <div class="uploaded-files" id="uploaded-files">
            <h3>Uploaded Files</h3>
            <div id="uploaded-files-list"></div>
        </div>
        
        <footer>
            <p>Note: This is a frontend demonstration. Files are not actually uploaded to any server.</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const browseBtn = document.getElementById('browse-btn');
            const fileInfo = document.getElementById('file-info');
            const fileDetails = document.getElementById('file-details');
            const uploadBtn = document.getElementById('upload-btn');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const uploadStatus = document.getElementById('upload-status');
            const uploadedFiles = document.getElementById('uploaded-files');
            const uploadedFilesList = document.getElementById('uploaded-files-list');
            
            let selectedFile = null;
            
            // Open file dialog when clicking the browse button
            browseBtn.addEventListener('click', () => {
                fileInput.click();
            });
            
            // Handle file selection
            fileInput.addEventListener('change', handleFileSelect);
            
            // Drag and drop event handlers
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });
            
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                
                if (e.dataTransfer.files.length) {
                    handleFiles(e.dataTransfer.files);
                }
            });
            
            // Handle the upload button click
            uploadBtn.addEventListener('click', simulateUpload);
            
            function handleFileSelect(e) {
                handleFiles(e.target.files);
            }
            
            function handleFiles(files) {
                if (files.length > 0) {
                    selectedFile = files[0];
                    
                    // Check file size (max 100MB)
                    if (selectedFile.size > 100 * 1024 * 1024) {
                        showNotification('File size exceeds 100MB limit.', 'error');
                        return;
                    }
                    
                    // Display file information
                    const fileSize = formatFileSize(selectedFile.size);
                    fileDetails.innerHTML = `
                        <strong>Name:</strong> ${selectedFile.name} <br>
                        <strong>Type:</strong> ${selectedFile.type || 'Unknown'} <br>
                        <strong>Size:</strong> ${fileSize}
                    `;
                    
                    fileInfo.style.display = 'block';
                    uploadBtn.style.display = 'block';
                    progressContainer.style.display = 'none';
                    uploadStatus.textContent = '';
                }
            }
            
            function formatFileSize(bytes) {
                if (bytes < 1024) return bytes + ' bytes';
                else if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
                else return (bytes / 1048576).toFixed(2) + ' MB';
            }
            
            function simulateUpload() {
                if (!selectedFile) return;
                
                // Disable the upload button during upload
                uploadBtn.disabled = true;
                uploadBtn.textContent = 'Uploading...';
                
                // Show progress container
                progressContainer.style.display = 'block';
                uploadStatus.textContent = 'Uploading... 0%';
                
                // Simulate upload progress
                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 10;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                        
                        // Update progress bar and status
                        progressBar.style.width = progress + '%';
                        uploadStatus.textContent = 'Upload Complete!';
                        
                        // Show success notification
                        showNotification(`"${selectedFile.name}" uploaded successfully!`, 'success');
                        
                        // Reset the button
                        uploadBtn.disabled = false;
                        uploadBtn.textContent = 'Upload File';
                        uploadBtn.style.display = 'none';
                        
                        // Add to uploaded files list
                        addToUploadedFiles(selectedFile);
                    } else {
                        // Update progress bar and status
                        progressBar.style.width = progress + '%';
                        uploadStatus.textContent = `Uploading... ${Math.round(progress)}%`;
                    }
                }, 200);
            }
            
            function addToUploadedFiles(file) {
                const fileSize = formatFileSize(file.size);
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-name">${file.name}</div>
                    <div class="file-size">${fileSize}</div>
                `;
                
                uploadedFilesList.appendChild(fileItem);
                uploadedFiles.style.display = 'block';
            }
            
            function showNotification(message, type) {
                const notification = document.createElement('div');
                notification.className = `notification ${type}`;
                notification.textContent = message;
                document.body.appendChild(notification);
                
                // Show notification
                setTimeout(() => {
                    notification.style.opacity = '1';
                }, 10);
                
                // Hide after 3 seconds
                setTimeout(() => {
                    notification.style.opacity = '0';
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 300);
                }, 3000);
            }
        });
    </script>
</body>
</html>
